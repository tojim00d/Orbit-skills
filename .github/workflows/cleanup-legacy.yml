name: Cleanup legacy

# One-time migration helper: removes the previous v3.0.0 release/tag and old
# workflow runs after the repository history is replaced.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: Remove previous release, tag and old runs
    runs-on: ubuntu-latest
    steps:
      - name: Clean legacy artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          base = f"https://api.github.com/repos/{repo}"

          def req(method, path):
              r = urllib.request.Request(
                  base + path, method=method,
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(r) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          code, body = req("GET", "/releases/tags/v3.0.0")
          if code == 200:
              rid = json.loads(body)["id"]
              print("delete release v3.0.0:", req("DELETE", f"/releases/{rid}")[0])
          else:
              print("no v3.0.0 release:", code)

          code, _ = req("GET", "/git/ref/tags/v3.0.0")
          if code == 200:
              print("delete tag v3.0.0:", req("DELETE", "/git/refs/tags/v3.0.0")[0])
          else:
              print("no v3.0.0 tag:", code)

          code, body = req("GET", "/actions/runs?per_page=100")
          if code == 200:
              for run in json.loads(body).get("workflow_runs", []):
                  if run.get("head_sha") == sha:
                      continue
                  print("delete run", run["id"], run.get("name"), req("DELETE", f"/actions/runs/{run['id']}")[0])
          PY
